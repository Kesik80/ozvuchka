<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eceef4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11131b" media="(prefers-color-scheme: dark)">
<title>ОЗВУЧКА</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Onest:wght@400;500;600;700&display=swap">
<script>
  // тема до отрисовки — без вспышки
  (function () {
    var t = 'auto';
    try { t = (JSON.parse(localStorage.getItem('ozv.prefs') || '{}').theme) || 'auto'; } catch (e) {}
    if (t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
  })();
</script>
<link rel="stylesheet" href="/reader.css">
<link rel="stylesheet" href="/app.css">
</head>
<body data-install="banner" class="mode-edit">

<div class="shell">

  <!-- Проекты: боковая панель на широком экране, на телефоне — в меню -->
  <aside class="side" id="side" aria-label="Проекты">
    <div class="brand">
      <img src="/icons/icon-192.png" alt="" width="30" height="30">
      <span>ОЗВУЧКА</span>
    </div>
    <button class="btn primary block" id="sideNew" type="button">Новый проект</button>
    <div class="proj-list" id="sideList"></div>
  </aside>

  <div class="main">
    <header class="top">
      <button class="ib narrow-only" id="btnProjects" type="button" title="Проекты" aria-label="Проекты">
        <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h10v2H4z"/></svg>
      </button>
      <input class="title-in" id="title" type="text" maxlength="120" aria-label="Название" autocomplete="off" spellcheck="false">
      <div class="mode" role="tablist" aria-label="Режим">
        <button type="button" role="tab" data-mode="edit" aria-selected="true" title="Правка">
          <svg viewBox="0 0 24 24"><path d="M4 17.2V20h2.8l8.3-8.3-2.8-2.8L4 17.2zm13.7-7.5a.9.9 0 0 0 0-1.3l-2.1-2.1a.9.9 0 0 0-1.3 0l-1.4 1.4 2.8 2.8 2-.8z"/></svg><span>Правка</span>
        </button>
        <button type="button" role="tab" data-mode="read" aria-selected="false" title="Чтение">
          <svg viewBox="0 0 24 24"><path d="M12 6.5C10.3 5.2 8 4.5 5 4.5H3v13h2c3 0 5.3.7 7 2 1.7-1.3 4-2 7-2h2v-13h-2c-3 0-5.3.7-7 2zm-1 10.8c-1.6-.8-3.6-1.3-6-1.3V6.5c2.6 0 4.6.6 6 1.8v9zm8-1.3c-2.4 0-4.4.5-6 1.3v-9c1.4-1.2 3.4-1.8 6-1.8V16z"/></svg><span>Чтение</span>
        </button>
      </div>
      <button class="ib wide-only" id="btnImport" type="button" title="Импорт текста" aria-label="Импорт">
        <svg viewBox="0 0 24 24"><path d="M12 3l5.7 5.7-1.4 1.4L13 6.8V16h-2V6.8L7.7 10.1 6.3 8.7 12 3zM5 18h14v2H5z"/></svg>
      </button>
      <button class="ib wide-only" id="btnExport" type="button" title="Скачать" aria-label="Скачать">
        <svg viewBox="0 0 24 24"><path d="M11 3h2v9.2l3.3-3.3 1.4 1.4L12 16l-5.7-5.7 1.4-1.4 3.3 3.3V3zM5 18h14v2H5z"/></svg>
      </button>
      <button class="quota" id="btnQuota" type="button" title="ElevenLabs"></button>
      <button class="ib" id="btnMore" type="button" title="Ещё" aria-label="Ещё">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="5.5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="18.5" r="1.8"/></svg>
      </button>
    </header>

    <!-- Роли -->
    <div class="cast" id="cast" aria-label="Роли"></div>

    <!-- Форматирование (только в правке) -->
    <div class="fmt" id="fmt" role="toolbar" aria-label="Форматирование">
      <button type="button" data-cmd="bold" title="Жирный"><b>Ж</b></button>
      <button type="button" data-cmd="italic" title="Курсив"><i>К</i></button>
      <button type="button" data-cmd="underline" title="Подчёркнутый"><u>Ч</u></button>
      <button type="button" data-cmd="mark" title="Выделить маркером"><span class="mk">М</span></button>
      <button type="button" data-cmd="clear" title="Убрать оформление">
        <svg viewBox="0 0 24 24"><path d="M6 5h12v2.5h-4.6L11.9 13 9.6 10.7l1.1-3.2H6V5zm-2.6.3L5 3.9l15 15-1.4 1.4-6.3-6.3L10.6 19H8l2.2-6.3-6.8-7.4z"/></svg>
      </button>
      <span class="sep"></span>
      <button type="button" data-cmd="line" title="Новая реплика">+ Реплика</button>
      <button type="button" data-cmd="heading" title="Заголовок">+ Заголовок</button>
      <span class="sep"></span>
      <button type="button" data-cmd="import" title="Вставить текст или файл">Импорт</button>
    </div>

    <main class="doc-wrap">
      <div id="doc"></div>
    </main>
  </div>
</div>

<button class="gen" id="gen" type="button" hidden></button>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="fileAudio" accept="audio/*,.mp3,.m4a,.wav,.ogg" hidden>
<input type="file" id="fileImport" accept=".txt,.docx,.html,.htm,text/plain,text/html" hidden>

<script src="https://cdn.jsdelivr.net/npm/mammoth@1.12.3/mammoth.browser.min.js" defer></script>
<script src="/reader.js"></script>
<script src="/app.js"></script>
<script src="/install.js"></script>
<script src="console.js"></script>
</body>
</html>
